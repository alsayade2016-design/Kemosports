    .channel-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.3s cubic-bezier(0.25,0.8,0.25,1), border-color 0.3s, box-shadow 0.3s; position: relative; animation: fadeUp 0.5s ease both; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    /* MODAL */

    /* LOADING */

    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .loading-bar { width: 120px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .loading-bar::after { content: ''; display: block; height: 100%; width: 40%; background: var(--red); border-radius: 2px; animation: slide 1s ease-in-out infinite; }
    @keyframes slide { 0%{transform:translateX(-100%);} 100%{transform:translateX(350%);} }

    /* RESPONSIVE */
    @media (max-width: 768px) {

      .hero { padding: 0 24px; height: 200px; }
      .section-header { padding: 30px 20px 16px; }

    @media (max-width: 500px) {

    }
  </style>
</head>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCT6trRLMclBxdje_UrL-_P2ej54YkdzKA",
    authDomain: "kemosports-88cfc.firebaseapp.com",
    databaseURL: "https://kemosports-88cfc-default-rtdb.firebaseio.com",
    projectId: "kemosports-88cfc",
    storageBucket: "kemosports-88cfc.firebasestorage.app",
    messagingSenderId: "131859386408",
    appId: "1:131859386408:web:5902546120d7b9d4b6a51d"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const TOTAL = 9;
  const grid  = document.getElementById('channelsGrid');
  const loading = document.getElementById('loadingScreen');

  // Modal
  const overlay    = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalFrame = document.getElementById('modalFrame');
  const modalClose = document.getElementById('modalClose');

  function openModal(title, url) {
    modalTitle.textContent = title || 'بث مباشر';
    modalFrame.src = url;
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    overlay.classList.remove('active');
    modalFrame.src = '';
    document.body.style.overflow = '';
  }
  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Convert YouTube URL
  function toEmbedUrl(url) {
    if (!url) return '';
    if (url.includes('youtube.com/live/')) {
      const id = url.split('/live/')[1].split('?')[0];
      return `https://www.youtube.com/embed/${id}?autoplay=1`;
    }
    if (url.includes('youtube.com/embed/')) return url + (url.includes('?') ? '&autoplay=1' : '?autoplay=1');
    return url;
  }

  // Build card HTML
  function buildCard(index, data) {
    const num   = index + 1;
    const title = data?.title || '';
    const url   = data?.url   || '';
    const desc  = data?.description || '';
    const thumb = data?.thumbnail || '';
    const hasStream = !!url;

    const thumbHTML = thumb
      ? `<img src="${thumb}" alt="${title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholderHTML = `<div class="thumb-placeholder" ${thumb ? 'style="display:none"' : ''}><span class="ch-num">${num}</span></div>`;

    return `
      <div class="channel-card" data-url="${toEmbedUrl(url)}" data-title="${title || `قناة كيمو ${num}`}" ${hasStream ? 'onclick="window._openCard(this)"' : ''}>
        <div class="card-thumb">
          ${thumbHTML}${placeholderHTML}
          ${hasStream ? '<div class="live-badge">LIVE</div>' : ''}
          <div class="card-ch-num">CH ${num}</div>
        </div>
        <div class="card-body">
          <div class="card-title ${!title ? 'empty' : ''}">${title || `قناة كيمو ${num}`}</div>
          ${desc ? `<div class="card-desc">${desc}</div>` : ''}
          <div class="card-footer">
            <button class="watch-btn ${!hasStream ? 'disabled' : ''}" ${hasStream ? `onclick="event.stopPropagation();window._openCard(this.closest('.channel-card'))"` : ''}>
              <svg viewBox="0 0 16 16"><path d="M3 2l10 6-10 6z"/></svg>
              ${hasStream ? 'مشاهدة' : 'قريباً'}
            </button>
            ${hasStream ? '<span class="card-quality">HD</span>' : ''}
          </div>
        </div>
      </div>
    `;
  }

  window._openCard = function(card) {
    const url   = card.dataset.url;
    const title = card.dataset.title;
    if (url) openModal(title, url);
  };

  // Social icons
  const WA_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.116 1.523 5.845L0 24l6.335-1.509A11.946 11.946 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.8 9.8 0 01-5.007-1.371l-.36-.214-3.727.978.995-3.635-.234-.374A9.818 9.818 0 012.182 12C2.182 6.579 6.579 2.182 12 2.182S21.818 6.579 21.818 12 17.421 21.818 12 21.818z"/></svg>`;
  const TT_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.75a4.85 4.85 0 01-1.01-.06z"/></svg>`;
  const MS_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12c0 6.016 4.432 10.984 10.206 11.852V15.18H7.237v-3.154h2.969V9.927c0-3.475 1.693-5 4.581-5 1.383 0 2.115.103 2.461.149v2.753h-1.97c-1.226 0-1.654 1.163-1.654 2.473v1.724h3.593l-.487 3.154h-3.106v8.697C19.481 23.083 24 18.075 24 12c0-6.627-5.373-12-12-12z"/></svg>`;

  function renderSocial(s) {
    const container = document.getElementById('socialLinks');
    const items = [
      { key:'whatsapp',  label:'واتساب',  cls:'wa', icon: WA_ICON, make: v => v ? 'https://wa.me/' + v.replace(/[^0-9]/g,'') : null },
      { key:'tiktok',    label:'تيك توك', cls:'tt', icon: TT_ICON, make: v => v ? 'https://tiktok.com/@' + v.replace('@','') : null },
      { key:'messenger', label:'ماسنجر',  cls:'ms', icon: MS_ICON, make: v => v ? 'https://m.me/' + v : null },
    ];
    container.innerHTML = items.map(it => {
      const val = (s && s[it.key]) || '';
      const url = it.make(val);
      const tag = url ? 'a' : 'div';
      const attrs = url ? ` href="${url}" target="_blank" rel="noopener"` : '';
      return `<${tag} class="social-link ${it.cls}"${attrs}>
        <span class="soc-${it.cls}">${it.icon}</span>
        <div><div>${it.label}</div>${val ? '' : '<div class="social-placeholder">قريباً</div>'}</div>
      </${tag}>`;
    }).join('');
  }

  // Listen to Firebase - channels
  const channelsRef = ref(db, 'channels');
  onValue(channelsRef, (snapshot) => {
    const data = snapshot.val() || {};
    let html = '';
    let liveCount = 0;
    for (let i = 0; i < TOTAL; i++) {
      const ch = data[i] || {};
      if (ch.url) liveCount++;
      html += buildCard(i, ch);
    }
    grid.innerHTML = html;
    document.getElementById('liveCount').textContent = liveCount ? `${liveCount} قنوات مباشرة` : '9 قنوات';
    setTimeout(() => loading.classList.add('hidden'), 600);
  }, (error) => {
    console.error(error);
    let html = '';
    for (let i = 0; i < TOTAL; i++) html += buildCard(i, {});
    grid.innerHTML = html;
    loading.classList.add('hidden');
  });

  // Listen to Firebase - social
  onValue(ref(db, 'social'), (snapshot) => {
    renderSocial(snapshot.val() || {});
  }, () => renderSocial({}));

</script>


<!-- Viewer & Notify JS -->
<div class="notify-toast" id="notifyToast"></div>
<script>
// ── Viewer Counter ──
(function() {
  // Base around match times (realistic: 400-900 during matches, 80-200 off-peak)
  var base = 320;
  var current = base + Math.floor(Math.random() * 200);
  var el = document.getElementById('viewerNum');

  function toArabicNum(n) {
    return n.toLocaleString('en-US');
  }

  function isMatchTime() {
    var h = new Date().getHours();
    // Match hours: 17:00-23:00 (peak), 13:00-16:00 (afternoon)
    return (h >= 17 && h <= 23) || (h >= 13 && h <= 16);
  }

  function getTarget() {
    if (isMatchTime()) {
      return 400 + Math.floor(Math.random() * 600); // 400-1000
    } else {
      return 60 + Math.floor(Math.random() * 140); // 60-200
    }
  }

  var target = getTarget();

  function updateViewer() {
    // Move current toward target gradually
    var diff = target - current;
    var step = Math.floor(diff * 0.08) + (Math.random() > 0.5 ? 1 : -1) * Math.floor(Math.random() * 8);
    current = Math.max(50, current + step);

    // Occasionally pick new target
    if (Math.abs(current - target) < 15 || Math.random() < 0.05) {
      target = getTarget();
    }

    el.textContent = toArabicNum(current);

    // Pop animation on big jumps
    if (Math.abs(step) > 10) {
      el.classList.add('pop');
      setTimeout(function() { el.classList.remove('pop'); }, 400);
    }
  }

  // Init
  el.textContent = toArabicNum(current);

  // Update every 4-8 seconds randomly
  function scheduleUpdate() {
    var delay = 4000 + Math.random() * 4000;
    setTimeout(function() {
      updateViewer();
      scheduleUpdate();
    }, delay);
  }
  scheduleUpdate();
})();

// ── Notify Bell ──
var notifyOn = false;
function toggleNotify() {
  notifyOn = !notifyOn;
  var btn  = document.getElementById('notifyBtn');
  var toast = document.getElementById('notifyToast');

  btn.classList.toggle('active', notifyOn);

  toast.textContent = notifyOn
    ? '🔔 سيتم تنبيهك عند بدء المباريات!'
    : '🔕 تم إلغاء التنبيه';
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2500);
}
</script>
