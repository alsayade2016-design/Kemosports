<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="monetag" content="196a7d06aca8e42b75a7735ee9b619e5">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KemoSports — البث المباشر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #080808;
      --surface:   #111111;
      --card:      #161616;
      --border:    #222222;
      --red:       #E50914;
      --red-dim:   #8B0000;
      --red-glow:  rgba(229,9,20,0.35);
      --text:      #EEEEEE;
      --muted:     #888888;
      --live-dot:  #FF3B3B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ════════════════════════════
       HEADER / NAV
    ════════════════════════════ */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 64px;
      background: linear-gradient(to bottom, rgba(8,8,8,0.98) 0%, rgba(8,8,8,0.85) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(229,9,20,0.15);
    }

    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
      text-shadow: 0 0 20px var(--red-glow), 0 0 40px rgba(229,9,20,0.15);
      text-decoration: none;
      position: relative;
    }
    .logo span { color: var(--text); }

    .logo-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--muted);
      margin-right: 8px;
      vertical-align: middle;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--live-dot);
      text-transform: uppercase;
    }
    .live-indicator::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--live-dot);
      box-shadow: 0 0 8px var(--live-dot);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ════════════════════════════
       HERO BANNER
    ════════════════════════════ */
    .hero {
      position: relative;
      overflow: hidden;
      height: 280px;
      display: flex;
      align-items: center;
      padding: 0 60px;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(105deg, rgba(229,9,20,0.18) 0%, transparent 55%),
        linear-gradient(to bottom, transparent 0%, var(--bg) 100%),
        repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 2px,
          rgba(229,9,20,0.03) 2px,
          rgba(229,9,20,0.03) 4px
        );
    }

    .hero-line {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, transparent, var(--red), transparent);
      animation: scanline 3s ease-in-out infinite;
    }
    @keyframes scanline {
      0%,100% { opacity: 0; transform: translateX(0); }
      50% { opacity: 1; }
    }

    .hero-content { position: relative; z-index: 1; }

    .hero-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hero-tag::before {
      content: '';
      width: 24px; height: 2px;
      background: var(--red);
    }

    .hero h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      text-transform: uppercase;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--red);
      text-shadow: 0 0 30px var(--red-glow);
    }

    .hero p {
      margin-top: 16px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 300;
      max-width: 420px;
      line-height: 1.6;
    }

    /* ════════════════════════════
       SECTION TITLES
    ════════════════════════════ */
    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 40px 40px 20px;
    }

    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to left, transparent, var(--border));
    }

    .section-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 2px;
    }

    /* ════════════════════════════
       CHANNEL GRID
    ════════════════════════════ */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 40px 60px;
    }

    /* ── Channel Card ── */
    .channel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.25,0.8,0.25,1),
                  border-color 0.3s ease,
                  box-shadow 0.3s ease;
      position: relative;
      animation: fadeUp 0.5s ease both;
    }
    .channel-card:hover {
      transform: translateY(-6px) scale(1.015);
      border-color: var(--red);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px var(--red), 0 0 30px var(--red-glow);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .channel-card:nth-child(1)  { animation-delay: 0.05s; }
    .channel-card:nth-child(2)  { animation-delay: 0.10s; }
    .channel-card:nth-child(3)  { animation-delay: 0.15s; }
    .channel-card:nth-child(4)  { animation-delay: 0.20s; }
    .channel-card:nth-child(5)  { animation-delay: 0.25s; }
    .channel-card:nth-child(6)  { animation-delay: 0.30s; }
    .channel-card:nth-child(7)  { animation-delay: 0.35s; }
    .channel-card:nth-child(8)  { animation-delay: 0.40s; }
    .channel-card:nth-child(9)  { animation-delay: 0.45s; }

    /* Thumbnail */
    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #0d0d0d;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, opacity 0.3s ease;
      opacity: 0.85;
    }
    .channel-card:hover .card-thumb img { transform: scale(1.06); opacity: 1; }

    /* Default thumb when no image */
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111 0%, #1a0a0a 100%);
    }
    .thumb-placeholder .ch-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 64px;
      font-weight: 900;
      color: rgba(229,9,20,0.2);
      line-height: 1;
    }

    /* Gradient overlay on thumb */
    .card-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(22,22,22,0.95) 0%, rgba(22,22,22,0.1) 60%, transparent 100%);
    }

    /* Live badge on thumb */
    .live-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: var(--red);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 3px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 10px rgba(229,9,20,0.5);
    }
    .live-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1s infinite;
    }

    /* Channel number on thumb */
    .card-ch-num {
      position: absolute;
      bottom: 10px;
      right: 12px;
      z-index: 2;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }

    /* Card body */
    .card-body {
      padding: 14px 16px 18px;
    }

    .card-title {
      font-family: 'Tajawal', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-title.empty { color: var(--muted); font-weight: 400; font-size: 14px; }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .watch-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 7px 16px;
      font-family: 'Tajawal', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .watch-btn:hover {
      background: #ff1a1a;
      transform: scale(1.03);
      box-shadow: 0 4px 16px var(--red-glow);
    }
    .watch-btn svg { width: 14px; height: 14px; fill: #fff; }
    .watch-btn.disabled {
      background: var(--border);
      color: var(--muted);
      cursor: default;
      pointer-events: none;
    }

    .card-quality {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 2px;
    }

    /* ════════════════════════════
       PLAYER MODAL
    ════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      width: 100%;
      max-width: 960px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transform: translateY(30px) scale(0.97);
      transition: transform 0.35s cubic-bezier(0.25,0.8,0.25,1);
      box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 0 1px rgba(229,9,20,0.2);
    }
    .modal-overlay.active .modal { transform: translateY(0) scale(1); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(229,9,20,0.05);
    }

    .modal-title {
      font-family: 'Tajawal', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      line-height: 1;
    }
    .modal-close:hover { border-color: var(--red); color: var(--red); background: rgba(229,9,20,0.1); }

    .modal-player {
      position: relative;
      aspect-ratio: 16/9;
      background: #000;
    }
    .modal-player iframe {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* ════════════════════════════
       FOOTER
    ════════════════════════════ */
    footer {
      border-top: 1px solid var(--border);
      padding: 30px 40px;
      text-align: center;
    }
    footer p {
      font-size: 13px;
      color: var(--muted);
      font-weight: 300;
    }
    footer strong {
      color: var(--red);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* ════════════════════════════
       LOADING STATE
    ════════════════════════════ */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 300;
      transition: opacity 0.5s ease;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }

    .loading-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--red);
      text-shadow: 0 0 40px var(--red-glow);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

    .loading-bar {
      width: 120px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: var(--red);
      border-radius: 2px;
      animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide { 0%{transform:translateX(-100%);} 100%{transform:translateX(350%);} }

    /* ════════════════════════════
       RESPONSIVE
    ════════════════════════════ */
    @media (max-width: 768px) {
      header { padding: 0 20px; }
      .hero  { padding: 0 24px; height: 200px; }
      .section-header { padding: 30px 20px 16px; }
      .channels-grid  { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 0 20px 40px; }
      footer { padding: 20px; }
    }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">KEMOSPORTS</div>
  <div class="loading-bar"></div>
</div>

<!-- Header -->
<header>
  <a class="logo" href="#">KEMO<span>SPORTS</span></a>
  <div class="live-indicator">بث مباشر</div>
</header>

<!-- Hero -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-line"></div>
  <div class="hero-content">
    <div class="hero-tag">منصة البث الرياضي</div>
    <h1>شاهد <em>المباريات</em><br>مباشرةً</h1>
    <p>أقوى تجربة بث مباشر للمباريات الكروية — جودة عالية، بدون انقطاع.</p>
  </div>
</section>

<!-- Section Header -->
<div class="section-header">
  <h2 class="section-title">القنوات المباشرة</h2>
  <div class="section-line"></div>
  <div class="section-count" id="liveCount">9 قنوات</div>
</div>

<!-- Channels Grid -->
<div class="channels-grid" id="channelsGrid">
  <!-- Cards injected by JS -->
</div>

<!-- Footer -->
<footer>
  <p>جميع الحقوق محفوظة &copy; 2026 &nbsp;—&nbsp; <strong>KEMOSPORTS</strong></p>
</footer>

<!-- Player Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">—</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-player">
      <iframe id="modalFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCT6trRLMclBxdje_UrL-_P2ej54YkdzKA",
    authDomain: "kemosports-88cfc.firebaseapp.com",
    databaseURL: "https://kemosports-88cfc-default-rtdb.firebaseio.com",
    projectId: "kemosports-88cfc",
    storageBucket: "kemosports-88cfc.firebasestorage.app",
    messagingSenderId: "131859386408",
    appId: "1:131859386408:web:5902546120d7b9d4b6a51d"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const TOTAL = 9;
  const grid  = document.getElementById('channelsGrid');
  const loading = document.getElementById('loadingScreen');

  // Modal
  const overlay   = document.getElementById('modalOverlay');
  const modalTitle= document.getElementById('modalTitle');
  const modalFrame= document.getElementById('modalFrame');
  const modalClose= document.getElementById('modalClose');

  function openModal(title, url) {
    modalTitle.textContent = title || 'بث مباشر';
    modalFrame.src = url;
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    overlay.classList.remove('active');
    modalFrame.src = '';
    document.body.style.overflow = '';
  }
  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Convert YouTube URL if needed
  function toEmbedUrl(url) {
    if (!url) return '';
    if (url.includes('youtube.com/live/')) {
      const id = url.split('/live/')[1].split('?')[0];
      return `https://www.youtube.com/embed/${id}?autoplay=1`;
    }
    if (url.includes('youtube.com/embed/')) return url + (url.includes('?') ? '&autoplay=1' : '?autoplay=1');
    return url;
  }

  // Build card HTML
  function buildCard(index, data) {
    const num   = index + 1;
    const title = data?.title || '';
    const url   = data?.url   || '';
    const desc  = data?.description || '';
    const thumb = data?.thumbnail || '';
    const hasStream = !!url;

    const thumbHTML = thumb
      ? `<img src="${thumb}" alt="${title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholderHTML = `<div class="thumb-placeholder" ${thumb ? 'style="display:none"' : ''}><span class="ch-num">${num}</span></div>`;

    return `
      <div class="channel-card" data-url="${toEmbedUrl(url)}" data-title="${title || `قناة كيمو ${num}`}" ${hasStream ? 'onclick="window._openCard(this)"' : ''}>
        <div class="card-thumb">
          ${thumbHTML}${placeholderHTML}
          ${hasStream ? '<div class="live-badge">LIVE</div>' : ''}
          <div class="card-ch-num">CH ${num}</div>
        </div>
        <div class="card-body">
          <div class="card-title ${!title ? 'empty' : ''}">${title || `قناة كيمو ${num}`}</div>
          ${desc ? `<div class="card-desc">${desc}</div>` : ''}
          <div class="card-footer">
            <button class="watch-btn ${!hasStream ? 'disabled' : ''}" ${hasStream ? `onclick="event.stopPropagation();window._openCard(this.closest('.channel-card'))"` : ''}>
              <svg viewBox="0 0 16 16"><path d="M3 2l10 6-10 6z"/></svg>
              ${hasStream ? 'مشاهدة' : 'قريباً'}
            </button>
            ${hasStream ? '<span class="card-quality">HD</span>' : ''}
          </div>
        </div>
      </div>
    `;
  }

  window._openCard = function(card) {
    const url   = card.dataset.url;
    const title = card.dataset.title;
    if (url) openModal(title, url);
  };

  // Listen to Firebase
  const channelsRef = ref(db, 'channels');
  onValue(channelsRef, (snapshot) => {
    const data = snapshot.val() || {};
    let html = '';
    let liveCount = 0;

    for (let i = 0; i < TOTAL; i++) {
      const ch = data[i] || {};
      if (ch.url) liveCount++;
      html += buildCard(i, ch);
    }

    grid.innerHTML = html;
    document.getElementById('liveCount').textContent = liveCount ? `${liveCount} قنوات مباشرة` : '9 قنوات';

    // Hide loading
    setTimeout(() => loading.classList.add('hidden'), 600);
  }, (error) => {
    console.error(error);
    // Render empty cards on error
    let html = '';
    for (let i = 0; i < TOTAL; i++) html += buildCard(i, {});
    grid.innerHTML = html;
    loading.classList.add('hidden');
  });
</script>

</body>
</html>
