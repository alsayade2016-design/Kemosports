<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KemoSports — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080808;--surface:#111;--card:#161616;--border:#222;--red:#E50914;--red-glow:rgba(229,9,20,.3);--text:#eee;--muted:#777;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;}

/* login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:40px;width:100%;max-width:380px;text-align:center;}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--red);letter-spacing:3px;margin-bottom:4px;}
.login-logo span{color:#fff;}
.login-sub{font-size:12px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:28px;}
.login-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:12px 16px;color:#fff;font-family:'Tajawal',sans-serif;font-size:15px;margin-bottom:12px;outline:none;transition:border-color .2s;}
.login-input:focus{border-color:var(--red);}
.login-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:4px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:3px;cursor:pointer;transition:background .2s;}
.login-btn:hover{background:#ff1a1a;}
.login-err{color:var(--red);font-size:13px;margin-top:8px;display:none;}

/* dashboard */
.dashboard{display:none;}
header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:var(--surface);border-bottom:1px solid var(--border);}
.h-logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:var(--red);letter-spacing:2px;}
.h-logo span{color:#fff;}
.h-right{display:flex;align-items:center;gap:12px;}
.save-all-btn{background:var(--red);color:#fff;border:none;border-radius:4px;padding:8px 20px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.save-all-btn:hover{background:#ff1a1a;box-shadow:0 0 20px var(--red-glow);}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:8px 16px;font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}

.main{padding:28px 32px;max-width:1100px;margin:0 auto;}

/* section */
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:32px 0 14px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* channel rows */
.ch-row{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:10px;transition:border-color .2s;}
.ch-row:hover{border-color:rgba(229,9,20,.3);}
.ch-num{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--red);margin-bottom:10px;text-transform:uppercase;}
.ch-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ch-inputs.four{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:700px){.ch-inputs{grid-template-columns:1fr;}.ch-inputs.four{grid-template-columns:1fr 1fr;}}
.field-label{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.ch-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:9px 12px;color:#fff;font-family:'Tajawal',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.ch-input:focus{border-color:var(--red);}
.ch-save{margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:7px 16px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.ch-save:hover{border-color:var(--red);color:var(--red);}
.ch-save.saved{border-color:#22c55e;color:#22c55e;}

/* social section */
.social-row{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px 18px;margin-bottom:10px;}
.social-field{margin-bottom:16px;}
.social-icon-label{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.social-icon-label svg{width:20px;height:20px;}
.social-icon-label span{font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.soc-wa{color:#25D366;}.soc-tt{color:#fff;}.soc-fb{color:#1877F2;}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:10px 24px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">KEMO<span>SPORTS</span></div>
    <div class="login-sub">لوحة التحكم</div>
    <input class="login-input" type="password" id="passInput" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-err" id="loginErr">كلمة المرور غلط</div>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <header>
    <div class="h-logo">KEMO<span>SPORTS</span> <span style="font-size:12px;color:var(--muted);letter-spacing:3px;font-weight:400">ADMIN</span></div>
    <div class="h-right">
      <button class="save-all-btn" onclick="saveAll()">حفظ الكل</button>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </header>

  <div class="main">

    <!-- Channels -->
    <div class="section-title">القنوات</div>
    <div id="channelRows"></div>

    <!-- Social -->
    <div class="section-title">التواصل الاجتماعي</div>
    <div class="social-row">
      <div class="social-field">
        <div class="social-icon-label">
          <svg class="soc-wa" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.116 1.523 5.845L0 24l6.335-1.509A11.946 11.946 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.8 9.8 0 01-5.007-1.371l-.36-.214-3.727.978.995-3.635-.234-.374A9.818 9.818 0 012.182 12C2.182 6.579 6.579 2.182 12 2.182S21.818 6.579 21.818 12 17.421 21.818 12 21.818z"/></svg>
          <span>واتساب</span>
        </div>
        <input class="ch-input" id="soc-whatsapp" placeholder="رقم الواتساب مثال: 966501234567"/>
      </div>
      <div class="social-field">
        <div class="social-icon-label">
          <svg class="soc-tt" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.75a4.85 4.85 0 01-1.01-.06z"/></svg>
          <span>تيك توك</span>
        </div>
        <input class="ch-input" id="soc-tiktok" placeholder="اسم المستخدم مثال: @kemosports"/>
      </div>
      <div class="social-field" style="margin-bottom:0">
        <div class="social-icon-label">
          <svg class="soc-fb" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          <span>فيسبوك</span>
        </div>
        <input class="ch-input" id="soc-facebook" placeholder="اسم الصفحة مثال: kemosports"/>
      </div>
      <div style="margin-top:16px">
        <button class="ch-save" id="soc-save-btn" onclick="saveSocial()">حفظ التواصل</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const PASS = "kemo2026";
const firebaseConfig = {
  apiKey:"AIzaSyCT6trRLMclBxdje_UrL-_P2ej54YkdzKA",
  authDomain:"kemosports-88cfc.firebaseapp.com",
  databaseURL:"https://kemosports-88cfc-default-rtdb.firebaseio.com",
  projectId:"kemosports-88cfc",
  storageBucket:"kemosports-88cfc.firebasestorage.app",
  messagingSenderId:"131859386408",
  appId:"1:131859386408:web:5902546120d7b9d4b6a51d"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

window.doLogin = function() {
  const v = document.getElementById('passInput').value;
  if(v === PASS) {
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('dashboard').style.display='block';
    loadData();
  } else {
    document.getElementById('loginErr').style.display='block';
  }
};
window.doLogout = function() {
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('dashboard').style.display='none';
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// Build channel rows
const TOTAL = 9;
function buildRows() {
  const container = document.getElementById('channelRows');
  let html = '';
  for(let i=0;i<TOTAL;i++){
    html += `<div class="ch-row">
      <div class="ch-num">قناة ${i+1}</div>
      <div class="ch-inputs four">
        <div><div class="field-label">عنوان المباراة</div><input class="ch-input" id="t${i}" placeholder="مثال: ريال مدريد vs برشلونة"/></div>
        <div><div class="field-label">رابط البث</div><input class="ch-input" id="u${i}" placeholder="https://..."/></div>
        <div><div class="field-label">وصف قصير</div><input class="ch-input" id="d${i}" placeholder="الدوري الإسباني"/></div>
        <div><div class="field-label">رابط الصورة (thumbnail)</div><input class="ch-input" id="th${i}" placeholder="https://..."/></div>
      </div>
      <button class="ch-save" id="sb${i}" onclick="saveCh(${i})">حفظ القناة ${i+1}</button>
    </div>`;
  }
  container.innerHTML = html;
}

function loadData() {
  buildRows();
  onValue(ref(db,'channels'),(snap)=>{
    const data = snap.val()||{};
    for(let i=0;i<TOTAL;i++){
      const ch=data[i]||{};
      document.getElementById(`t${i}`).value  = ch.title||'';
      document.getElementById(`u${i}`).value  = ch.url||'';
      document.getElementById(`d${i}`).value  = ch.description||'';
      document.getElementById(`th${i}`).value = ch.thumbnail||'';
    }
  },{onlyOnce:true});
  onValue(ref(db,'social'),(snap)=>{
    const s=snap.val()||{};
    document.getElementById('soc-whatsapp').value = s.whatsapp||'';
    document.getElementById('soc-tiktok').value   = s.tiktok||'';
    document.getElementById('soc-facebook').value = s.facebook||'';
  },{onlyOnce:true});
}

window.saveCh = async function(i) {
  const btn = document.getElementById(`sb${i}`);
  await set(ref(db,`channels/${i}`),{
    title:       document.getElementById(`t${i}`).value.trim(),
    url:         document.getElementById(`u${i}`).value.trim(),
    description: document.getElementById(`d${i}`).value.trim(),
    thumbnail:   document.getElementById(`th${i}`).value.trim(),
  });
  btn.textContent='✓ تم الحفظ'; btn.classList.add('saved');
  setTimeout(()=>{btn.textContent=`حفظ القناة ${i+1}`;btn.classList.remove('saved');},2000);
};

window.saveSocial = async function() {
  const btn = document.getElementById('soc-save-btn');
  await set(ref(db,'social'),{
    whatsapp: document.getElementById('soc-whatsapp').value.trim(),
    tiktok:   document.getElementById('soc-tiktok').value.trim(),
    facebook: document.getElementById('soc-facebook').value.trim(),
  });
  btn.textContent='✓ تم الحفظ'; btn.classList.add('saved');
  setTimeout(()=>{btn.textContent='حفظ التواصل';btn.classList.remove('saved');},2000);
};

window.saveAll = async function() {
  for(let i=0;i<TOTAL;i++) await window.saveCh(i);
  await window.saveSocial();
  showToast('✓ تم حفظ كل شيء');
};
</script>
</body>
</html>
